<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Attic Bass · ORGANISM</title>
<style>
  :root{
    --bg:#09090B; --chrome:#C8CCD4; --dim:#6B7080; --line:#1C1D22;
    --ink:#3A7AFF; --pad:#14151A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--chrome);font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
  #booth{
    position:fixed;left:12px;right:12px;bottom:12px;z-index:2;
    display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
    background:rgba(9,9,11,.72);border:1px solid var(--line);padding:10px 12px;
    backdrop-filter:blur(8px);
  }
  body.clean #booth{display:none}
  .col{display:flex;flex-direction:column;gap:6px;min-width:0}
  .lab{color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-size:10px}
  select,button{
    background:var(--pad);color:var(--chrome);border:1px solid #2A2C33;
    height:32px;padding:0 10px;font:inherit;cursor:pointer;
  }
  select{min-width:180px;max-width:42vw}
  button.on{border-color:var(--ink);color:var(--ink)}
  button.live{border-color:var(--ink);color:var(--ink)}
  button.rec{border-color:#E25B4A;color:#E25B4A}
  #pads{display:flex;gap:6px;flex-wrap:wrap}
  #pads button{min-width:64px}
  #meter{width:120px;height:8px;background:#1A1B20;border:1px solid var(--line)}
  #meter>i{display:block;height:100%;width:0;background:var(--ink)}
  #stat{color:var(--dim);white-space:nowrap}
  #lamp{width:8px;height:8px;border-radius:50%;background:#2A2C33;display:inline-block;margin-right:6px}
  #lamp.hot{background:var(--ink);box-shadow:0 0 8px var(--ink)}
  #err{position:fixed;top:12px;left:12px;right:12px;z-index:3;color:#E25B4A;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<div id="booth">
  <div class="col">
    <span class="lab">line-in</span>
    <select id="dev"><option value="">— выбрать устройство —</option></select>
  </div>
  <div class="col">
    <span class="lab">вход</span>
    <button id="arm">ARM</button>
  </div>
  <div class="col">
    <span class="lab">fx</span>
    <div id="pads">
      <button data-fx="mirror">MIRROR</button>
      <button data-fx="double">DOUBLE</button>
      <button data-fx="feed">FEED</button>
      <button data-fx="prism">PRISM</button>
      <button data-fx="ghost">GHOST</button>
    </div>
  </div>
  <div class="col">
    <span class="lab">amount</span>
    <input id="amt" type="range" min="0" max="1" step="0.01" value="0.55" style="width:110px;accent-color:#C8CCD4"/>
  </div>
  <div class="col">
    <span class="lab">камера</span>
    <button id="clap">CLAP</button>
  </div>
  <div class="col">
    <span class="lab">запись canvas</span>
    <button id="rec">REC</button>
  </div>
  <div class="col">
    <span class="lab">уровень</span>
    <div id="meter"><i id="mfill"></i></div>
    <div id="stat"><i id="lamp"></i><span id="sinfo">VOID · GEN 0 · нет сетки</span></div>
  </div>
</div>
<script src="./booth.js"></script>
</body>
</html>
